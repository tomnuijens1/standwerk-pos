name: Genereer Android signing-sleutel (eenmalig)

# Handmatig te starten via Actions-tab -> "Genereer Android signing-sleutel
# (eenmalig)" -> "Run workflow". Genereert één keer een nieuwe, willekeurig
# beveiligde keystore en toont die in de logs zodat je 'm kan overnemen in
# GitHub Secrets (Settings -> Secrets and variables -> Actions). Daarna nooit
# meer nodig — de gewone build-workflow (android-build.yml) leest de sleutel
# uit die secrets, hij komt nooit in de git-geschiedenis terecht.
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Genereer keystore met een willekeurig wachtwoord
        run: |
          PASSWORD=$(openssl rand -base64 24)
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias standwerk-pos \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Standwerk POS, OU=Standwerk, O=Standwerk, L=, ST=, C=NL"

          echo "::notice title=Kopieer deze twee waarden naar GitHub Secrets::Ga naar Settings > Secrets and variables > Actions > New repository secret. Maak twee secrets aan: ANDROID_KEYSTORE_BASE64 (zie onderstaande output) en ANDROID_KEYSTORE_PASSWORD (zie onderstaande output). Verwijder deze workflow-run-log daarna via Actions > deze run > ... > Delete workflow run, voor de zekerheid."
          echo "=== ANDROID_KEYSTORE_PASSWORD ==="
          echo "$PASSWORD"
          echo "=== ANDROID_KEYSTORE_BASE64 (alles hieronder, als één lange regel) ==="
          base64 -i release.keystore
